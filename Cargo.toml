[package]
name = "vault-mcp"
version = "0.1.0"
edition = "2021"
description = "Read-only MCP server (stdio) for finding and reading old Claude Code sessions cheaply"
license = "MIT"
readme = "README.md"
rust-version = "1.82"

[lib]
name = "vault_mcp"
path = "src/lib.rs"

[[bin]]
name = "vault-mcp"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
